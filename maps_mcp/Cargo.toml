[package]
name = "navcat-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
rmcp = { version = "3.6.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
