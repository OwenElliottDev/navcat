# Settings come from .env (see .env.example). Runs the published images, MAPS_TAG picks the
# release; docker-compose.dev.yml builds them from this checkout instead.
#
# Only port 7000 is public. The other ports bind to localhost for the Vite dev server.

services:
  maps-web:
    image: owenelliottdev/navcat-web:${MAPS_TAG:-latest}
    container_name: navcat-web
    restart: unless-stopped
    ports:
      - "7000:80"
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/terrain:/terrain:ro # topo tiles from maps-terrain-build
    depends_on:
      - maps-backend
      - maps-graphhopper
      - maps-otp
      - maps-photon
      - maps-tileserver

  maps-backend:
    image: owenelliottdev/navcat-backend:${MAPS_TAG:-latest}
    container_name: navcat-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:7800:8000"
    environment:
      DATABASE_URL: postgresql://maps:${MAPS_POSTGRES_PASSWORD}@maps-db/maps
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOW_PLACE_EDITS: ${ALLOW_PLACE_EDITS:-true}
      ALLOW_REVIEWS: ${ALLOW_REVIEWS:-true}
      ALLOW_PHOTOS: ${ALLOW_PHOTOS:-true}
      SAFETY_CHECK_PHOTOS: ${SAFETY_CHECK_PHOTOS:-true}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LINK_PREVIEW_CONCURRENCY: ${LINK_PREVIEW_CONCURRENCY:-4}
      PHOTOS_DIR: /data/photos
      GRAPHHOPPER_URL: http://maps-graphhopper:8989
      OTP_URL: http://maps-otp:8080
      PHOTON_URL: http://maps-photon:2322
      TILESERVER_URL: http://maps-tileserver:8080
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/photos:/data/photos
    depends_on:
      maps-db:
        condition: service_healthy

  maps-db:
    image: owenelliottdev/navcat-db:${MAPS_TAG:-latest}
    container_name: navcat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maps
      POSTGRES_USER: maps
      POSTGRES_PASSWORD: ${MAPS_POSTGRES_PASSWORD:?set MAPS_POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maps", "-d", "maps"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs on every `up`, but only re-imports when its inputs change
  maps-poi-import:
    image: owenelliottdev/navcat-db:${MAPS_TAG:-latest}
    container_name: navcat-poi-import
    depends_on:
      maps-db:
        condition: service_healthy
    environment:
      OSM_FILE: ${OSM_FILE:-australia.osm.pbf}
      PGHOST: maps-db
      PGDATABASE: maps
      PGUSER: maps
      PGPASSWORD: ${MAPS_POSTGRES_PASSWORD}
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/osm:/osm:ro
    entrypoint: ["sh", "/import/import-pois.sh"]

  # Runs on every `up` once GraphHopper is healthy, but only rebuilds when the elevation changes
  maps-terrain-build:
    image: owenelliottdev/navcat-terrain:${MAPS_TAG:-latest}
    container_name: navcat-terrain-build
    environment:
      WAIT_FOR: http://maps-graphhopper:8989/health
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/graphhopper/srtm:/elevation:ro
      - ${MAPS_DATA_DIR:-./maps_data}/terrain:/terrain

  maps-graphhopper:
    image: owenelliottdev/navcat-graphhopper:${MAPS_TAG:-latest}
    container_name: navcat-graphhopper
    restart: unless-stopped
    ports:
      - "127.0.0.1:7989:8989"
    environment:
      JAVA_OPTS: "-Xmx${GRAPHHOPPER_MEMORY:-3g}"
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/graphhopper:/data # the graph (default-gh) and elevation (srtm)
      - ${MAPS_DATA_DIR:-./maps_data}/osm:/osm:ro
    command: ["-i", "/osm/${OSM_FILE:-australia.osm.pbf}", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8989/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60m

  maps-otp:
    image: opentripplanner/opentripplanner:2.10.0
    container_name: navcat-otp
    restart: unless-stopped
    ports:
      - "127.0.0.1:7088:8080"
    environment:
      JAVA_OPTS: "-Xmx${OTP_MEMORY:-5g}"
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/transit:/var/opentripplanner
    command: ["--load"]

  maps-photon:
    image: rtuszik/photon-docker:2.4.0
    container_name: navcat-photon
    restart: unless-stopped
    ports:
      - "127.0.0.1:7322:2322"
    environment:
      REGION: ${PHOTON_REGION:-australia-oceania}
      UPDATE_STRATEGY: DISABLED # ./maps update search replaces the index instead
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/${PHOTON_DATA_DIR:-photon}:/photon/data

  maps-tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: navcat-tileserver
    restart: unless-stopped
    ports:
      - "127.0.0.1:7080:8080"
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/tiles:/data
    command: ["--file", "/data/${TILES_FILE:-australia.mbtiles}"]

  # Enabled by COMPOSE_PROFILES=mcp in .env. Setting MCP_BIND beyond localhost needs MCP_TOKEN.
  maps-mcp:
    image: owenelliottdev/navcat-mcp:${MAPS_TAG:-latest}
    container_name: navcat-mcp
    profiles: ["mcp"]
    restart: unless-stopped
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-7100}:8000"
    environment:
      MCP_BIND: ${MCP_BIND:-127.0.0.1}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      MCP_RATE_LIMIT: ${MCP_RATE_LIMIT:-120}
      MCP_TRUSTED_PROXIES: ${MCP_TRUSTED_PROXIES:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:7000}
    healthcheck:
      test: ["CMD", "/navcat-mcp", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - maps-backend
      - maps-graphhopper
      - maps-otp
      - maps-photon

  # Setup and updates: run by ./maps, or docker compose run --rm <name>

  # Runs updates on the schedules in .env. Started by `./maps schedule on`, which sets
  # MAPS_PROJECT_DIR to mount the repo at its host path, so relative bind mounts resolve the
  # same from inside. It has the Docker socket, so it's opt-in.
  maps-updater:
    image: owenelliottdev/navcat-updater:${MAPS_TAG:-latest}
    container_name: navcat-updater
    profiles: ["updates"]
    restart: unless-stopped
    environment:
      MAPS_PROJECT_DIR: ${MAPS_PROJECT_DIR:-}
      TZ: ${TZ:-UTC}
      UPDATE_TRANSIT_SCHEDULE: ${UPDATE_TRANSIT_SCHEDULE-0 3 * * 1}
      UPDATE_MAP_SCHEDULE: ${UPDATE_MAP_SCHEDULE-0 4 1 * *}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${MAPS_PROJECT_DIR:-/maps}
    working_dir: ${MAPS_PROJECT_DIR:-/maps}

  # Pass osm, elevation or places to fetch only that
  maps-download:
    image: owenelliottdev/navcat-download:${MAPS_TAG:-latest}
    profiles: ["setup"]
    environment:
      OSM_URL: ${OSM_URL:-https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf}
      OSM_FILE: ${OSM_FILE:-australia.osm.pbf}
      OVERTURE_PLACES: ${OVERTURE_PLACES:-true}
      OVERTURE_COUNTRIES: ${OVERTURE_COUNTRIES:-AU}
      OVERTURE_RELEASE: ${OVERTURE_RELEASE:-}
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/osm:/osm
      - ${MAPS_DATA_DIR:-./maps_data}/graphhopper/srtm:/srtm

  # Runs ./maps's shell commands in the data folder
  maps-data:
    image: owenelliottdev/navcat-download:${MAPS_TAG:-latest}
    profiles: ["setup"]
    environment:
      OSM_FILE: ${OSM_FILE:-australia.osm.pbf}
      TILES_FILE: ${TILES_FILE:-australia.mbtiles}
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}:/data
    working_dir: /data
    entrypoint: ["sh", "-c"]

  maps-graphhopper-import:
    image: owenelliottdev/navcat-graphhopper:${MAPS_TAG:-latest}
    profiles: ["setup"]
    environment:
      JAVA_OPTS: "-Xmx${GRAPHHOPPER_IMPORT_MEMORY:-8g}"
      SUBNETWORK_THREADS: ${GRAPHHOPPER_IMPORT_THREADS:-4} # threads for subnetwork removal
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/graphhopper:/data
      - ${MAPS_DATA_DIR:-./maps_data}/osm:/osm:ro
    command:
      - --import
      - -i
      - /osm/${OSM_FILE:-australia.osm.pbf}
      - -o
      - /data/${GRAPHHOPPER_GRAPH:-default-gh}

  maps-planetiler:
    image: ghcr.io/onthegomap/planetiler:latest
    profiles: ["setup"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx6g"
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/tiles:/data
      - ${MAPS_DATA_DIR:-./maps_data}/osm:/osm:ro
    # --download fetches coastline and lake data into tiles/sources
    command:
      - --download
      - --area=${TILES_AREA:-australia}
      - --osm_path=/osm/${OSM_FILE:-australia.osm.pbf}
      # The extract's boundary, written by maps-download
      - --polygon=/osm/${OSM_FILE:-australia.osm.pbf}.poly
      # ./maps update builds into another file, then swaps it in
      - --output=/data/${TILES_BUILD_FILE:-${TILES_FILE:-australia.mbtiles}}
      - --force

  maps-transit-download:
    image: owenelliottdev/navcat-download:${MAPS_TAG:-latest}
    profiles: ["setup"]
    environment:
      OSM_FILE: ${OSM_FILE:-australia.osm.pbf}
      TRANSIT_OSM_URL: ${TRANSIT_OSM_URL:-}
      TRANSIT_GTFS_URLS: ${TRANSIT_GTFS_URLS:-https://data.ptv.vic.gov.au/downloads/gtfs.zip https://gtfsrt.api.translink.com.au/GTFS/SEQ_GTFS.zip https://gtfs.adelaidemetro.com.au/v1/static/latest/google_transit.zip https://www.transperth.wa.gov.au/TimetablePDFs/GoogleTransit/Production/google_transit.zip}
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/transit:/data
      - ${MAPS_DATA_DIR:-./maps_data}/osm:/osm:ro
    entrypoint: ["sh", "/transit.sh"]

  maps-otp-build:
    image: opentripplanner/opentripplanner:2.10.0
    profiles: ["setup"]
    environment:
      JAVA_OPTS: "-Xmx${OTP_BUILD_MEMORY:-8g}"
    volumes:
      - ${MAPS_DATA_DIR:-./maps_data}/transit:/var/opentripplanner
    command: ["--build", "--save"]
