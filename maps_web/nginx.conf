# Behind an HTTPS reverse proxy (e.g. Nginx Proxy Manager), use the scheme it was reached
# by; with nothing in front, this server's. TileServer writes this into tile and font URLs, and an
# https page can't load http ones.
map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Road data overlay tiles are slow to make (the backend slims GraphHopper's), so keep them.
# Only ever filled from this stack's own GraphHopper.
proxy_cache_path /var/cache/nginx/road-data levels=1:2 keys_zone=roaddata:10m
                 max_size=1g inactive=30d use_temp_path=off;
# Shared links' previews (their OpenGraph tags and images), only made from this stack's data
proxy_cache_path /var/cache/nginx/link-previews levels=1:2 keys_zone=linkpreviews:10m
                 max_size=200m inactive=30d use_temp_path=off;
# A shared link's code (/go/<code>), and "?m" if it marks the spot: all a preview depends on,
# so other query parameters (e.g. trackers added by chat apps) don't make new cache entries
map $uri $link_code {
    "~^/go/(?<code>[^/]+)$" $code;
}
map $args $link_mark {
    "~(^|&)m(=|&|$)" "?m";
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # The other services are looked up by name when a request comes in (Docker's DNS), not
    # once at startup. So the site still starts if one of them is down or still starting,
    # and only that feature fails. (Proxying to a variable is what makes nginx do this.)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The visitor's real address, from a reverse proxy on a private network (Docker or the
    # LAN), so things like login rate-limiting see visitors rather than the proxy
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set $photon maps-photon;
    set $graphhopper maps-graphhopper;
    set $otp maps-otp;
    set $backend maps-backend;
    set $tileserver maps-tileserver;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The app. index.html is always re-checked so a new build shows up straight away;
    # everything in /assets has a content hash in its name, so it can be cached forever.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Shared links (OSM shortlinks, /go/<code>) open the app, which reads the code. The page
    # also gets OpenGraph tags from the backend (index.html includes /_link-meta), so chat apps
    # can preview the link; if the backend is down or slow, it's just the app.
    location /go/ {
        ssi on;
        set $link_meta "$link_code$link_mark";
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # For index.html's include on a /go/ page ($link_meta is set by the page's request)
    location = /_link-meta {
        internal;
        proxy_pass http://$backend:8000/api/links/meta/$link_meta;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_cache linkpreviews;
        proxy_cache_key "meta $original_scheme://$http_host/$link_meta";
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
    }

    # Shared links' preview images, rendered by the backend from TileServer (it sets how long
    # they're cached)
    location /api/links/preview/ {
        proxy_pass http://$backend:8000;
        proxy_cache linkpreviews;
        proxy_cache_key "$uri$link_mark";
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Search (Photon)
    location = /api/search {
        proxy_pass http://$photon:2322/api$is_args$args;
    }
    location = /api/reverse {
        proxy_pass http://$photon:2322/reverse$is_args$args;
    }

    # Routing (GraphHopper)
    location = /api/route {
        proxy_pass http://$graphhopper:8989/route$is_args$args;
    }
    location = /api/info {
        proxy_pass http://$graphhopper:8989/info$is_args$args;
    }

    # Public transport (OpenTripPlanner's GraphQL API). The host is looked up per
    # request, so nginx still starts when OTP isn't set up or is down.
    location = /api/transit {
        proxy_pass http://$otp:8080/otp/gtfs/v1;
    }

    # Speed limits and bike lanes for map overlays (maps_backend, from GraphHopper), cached
    location /api/road-data/ {
        proxy_pass http://$backend:8000;
        proxy_cache roaddata;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
    }

    # Accounts and browse (maps_backend). Exact /api/... matches above take priority.
    location /api/ {
        proxy_pass http://$backend:8000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Elevation for the topo map, built locally by the maps-terrain-build job.
    # All-sea tiles aren't written; they fall back to a flat sea-level tile.
    location ~ ^/terrain/(\d+/\d+/\d+\.png)$ {
        root /terrain/tiles;
        try_files /$1 /empty.png =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Whether terrain has been built (the app only offers the topo map if so)
    location = /terrain/info.json {
        alias /terrain/tiles/info.json;
        add_header Cache-Control "no-cache";
    }

    # Map style, tiles and fonts (TileServer GL). Passing the browser's Host header
    # makes TileServer build URLs that point back through this proxy.
    location ~ ^/(styles|data|fonts)/ {
        proxy_pass http://$tileserver:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
    }
}
