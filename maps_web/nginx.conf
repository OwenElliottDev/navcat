# Behind an HTTPS reverse proxy, use the scheme it was reached by; with nothing in front, this
# server's. TileServer writes this into tile and font URLs, and an https page can't load http ones.
map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Road data tiles are slow to make (the backend slims GraphHopper's)
proxy_cache_path /var/cache/nginx/road-data levels=1:2 keys_zone=roaddata:10m
                 max_size=1g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/link-previews levels=1:2 keys_zone=linkpreviews:10m
                 max_size=200m inactive=30d use_temp_path=off;
# A preview depends only on the code and ?m, so other query parameters (e.g. chat apps'
# trackers) don't make new cache entries
map $args $link_mark {
    "~(^|&)m(=|&|$)" "?m";
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Proxying to variables makes nginx resolve services per request, so it starts while one is down
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Client addresses from a reverse proxy on a private network, for the backend's rate limits
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set $photon maps-photon;
    set $graphhopper maps-graphhopper;
    set $otp maps-otp;
    set $backend maps-backend;
    set $tileserver maps-tileserver;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # index.html's include adds OpenGraph tags from the backend. Only shortlink-alphabet codes
    # ("@" is the legacy "~") get them, as the decoded path goes into a URL.
    location ~ "^/go/(?<link_code>[A-Za-z0-9_~@]{1,10}-{0,2})$" {
        ssi on;
        set $link_meta "$link_code$link_mark";
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location /go/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /_link-meta {
        internal;
        proxy_pass http://$backend:8000/api/links/meta/$link_meta;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_cache linkpreviews;
        proxy_cache_key "meta $original_scheme://$http_host/$link_meta";
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        # Otherwise the include would put the error body into the page
        proxy_intercept_errors on;
        error_page 400 404 422 500 502 503 504 = @no_link_meta;
    }
    location @no_link_meta {
        return 204;
    }

    # The backend sets how long these are cached
    location ~ "^/api/links/preview/[A-Za-z0-9_~@]{1,10}-{0,2}\.jpg$" {
        proxy_pass http://$backend:8000;
        proxy_cache linkpreviews;
        proxy_cache_key "$uri$link_mark";
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/search {
        proxy_pass http://$photon:2322/api$is_args$args;
    }
    location = /api/reverse {
        proxy_pass http://$photon:2322/reverse$is_args$args;
    }

    location = /api/route {
        proxy_pass http://$graphhopper:8989/route$is_args$args;
    }
    location = /api/info {
        proxy_pass http://$graphhopper:8989/info$is_args$args;
    }

    location = /api/transit {
        proxy_pass http://$otp:8080/otp/gtfs/v1;
    }

    location /api/road-data/ {
        proxy_pass http://$backend:8000;
        proxy_cache roaddata;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
    }

    location /api/ {
        proxy_pass http://$backend:8000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All-sea tiles aren't written; they fall back to a flat sea-level tile
    location ~ ^/terrain/(\d+/\d+/\d+\.png)$ {
        root /terrain/tiles;
        try_files /$1 /empty.png =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # The app checks this to offer the topo map
    location = /terrain/info.json {
        alias /terrain/tiles/info.json;
        add_header Cache-Control "no-cache";
    }

    # Passing the browser's Host header makes TileServer build URLs that point back through
    # this proxy
    location ~ ^/(styles|data|fonts)/ {
        proxy_pass http://$tileserver:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
    }
}
