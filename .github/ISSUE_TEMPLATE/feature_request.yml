name: Feature request
description: Suggest something Nav Cat should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or the trip you're planning, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, and anything you've tried instead.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data it needs
      description: >
        Where the data would come from, e.g. OSM tags, GTFS fields or a GraphHopper encoded value.
        Nav Cat makes no internet calls once set up, so it must be downloadable by `./maps setup`.
