name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests only run the jobs whose files changed; a skipped job still passes as a required
# check. Pushes to main run everything, as does a pull request if the change check fails.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      compose: ${{ github.event_name != 'pull_request' || steps.filter.outputs.compose == 'true' }}
      mcp: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mcp == 'true' }}

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # proxyConfig.test.ts reads docker-compose.yml; the API tests build docker_maps/db
          filters: |
            frontend:
              - .github/workflows/ci.yml
              - maps_web/**
              - docker-compose.yml
            backend:
              - .github/workflows/ci.yml
              - maps_backend/**
              - docker_maps/db/**
            compose:
              - .github/workflows/ci.yml
              - docker-compose*.yml
            mcp:
              - .github/workflows/ci.yml
              - maps_mcp/**

  frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps_web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: maps_web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  ui:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    # Keep the version in step with @playwright/test in maps_web/package.json; screenshots
    # are recorded in this image (npm run test:e2e:update)
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    defaults:
      run:
        working-directory: maps_web

    steps:
      - uses: actions/checkout@v7

      - run: npm ci

      - name: UI tests
        env:
          E2E_SCREENSHOTS: '1'
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            maps_web/playwright-report
            maps_web/test-results
          retention-days: 7

  backend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps_backend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyrefly check

      - name: Unit tests
        run: uv run pytest

      - name: API tests
        run: sh tests/api/run.sh

  mcp:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mcp == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps_mcp

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            maps_mcp/target
          key: cargo-${{ hashFiles('maps_mcp/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

  compose:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compose == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files
        env:
          MAPS_POSTGRES_PASSWORD: ci
        run: |
          docker compose --profile setup --profile updates --profile mcp config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            --profile setup --profile updates --profile mcp config -q
