name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps_web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maps_web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  # The app in a browser against mocked services (see maps_web/playwright.config.ts)
  ui:
    runs-on: ubuntu-latest
    # Keep the version in step with @playwright/test in maps_web/package.json; screenshots
    # are recorded in this image (npm run test:e2e:update)
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    defaults:
      run:
        working-directory: maps_web

    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: UI tests
        env:
          E2E_SCREENSHOTS: '1'
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            maps_web/playwright-report
            maps_web/test-results
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps_backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

      # Against a throwaway Postgres + PostGIS built from docker_maps/db
      - name: API tests
        run: sh tests/api/run.sh

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        env:
          MAPS_POSTGRES_PASSWORD: ci
        run: |
          docker compose --profile setup --profile updates config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            --profile setup --profile updates config -q
