name: Build & push images

# Push a v* tag (e.g. git tag v1.2.0 && git push origin v1.2.0) to publish every image as
# latest, the version and the commit. docker-compose.yml runs these. Pushes to main publish
# edge and the commit; pull requests only build them, to catch broken Dockerfiles.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: navcat-web
            context: maps_web
          - image: navcat-backend
            context: maps_backend
          - image: navcat-db
            context: docker_maps/db
          - image: navcat-graphhopper
            context: docker_maps/graphhopper
          - image: navcat-download
            context: docker_maps/download
          - image: navcat-terrain
            context: docker_maps/terrain
          - image: navcat-updater
            context: docker_maps/updater

    permissions:
      contents: read
      pull-requests: read

    env:
      PUBLISH: ${{ github.event_name == 'push' }}

    steps:
      # Pull requests only build the images whose build context changed
      - name: Check for changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            image:
              - .github/workflows/docker.yml
              - ${{ matrix.context }}/**

      - name: Checkout source
        if: steps.changes.outputs.image != 'false'
        uses: actions/checkout@v7

      # arm64 is emulated; the slow Maven and npm stages run natively (FROM --platform=$BUILDPLATFORM)
      - name: Set up QEMU
        if: steps.changes.outputs.image != 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.changes.outputs.image != 'false'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.changes.outputs.image != 'false'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: owenelliottdev/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=short

      - name: Build and push
        if: steps.changes.outputs.image != 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
