name: Build & push images

# Push a v* tag (e.g. git tag v1.2.0 && git push origin v1.2.0) to publish every image as
# latest, the version and the commit. docker-compose.yml runs these. Pushes to main and pull
# requests only build them, to catch broken Dockerfiles before a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: navcat-web
            context: maps_web
          - image: navcat-backend
            context: maps_backend
          - image: navcat-db
            context: docker_maps/db
          - image: navcat-graphhopper
            context: docker_maps/graphhopper
          - image: navcat-download
            context: docker_maps/download
          - image: navcat-terrain
            context: docker_maps/terrain
          - image: navcat-updater
            context: docker_maps/updater

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: owenelliottdev/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
