# Builds the images from this checkout. `./maps dev` uses it for one command; to use it always,
# put this in .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#
# Services that share an image each declare the build, so compose never pulls a :dev tag.

services:
  maps-web:
    build: ./maps_web
    image: navcat-web:dev
  maps-backend:
    build: ./maps_backend
    image: navcat-backend:dev
  maps-db:
    build: ./docker_maps/db
    image: navcat-db:dev
  maps-poi-import:
    build: ./docker_maps/db
    image: navcat-db:dev
  maps-terrain-build:
    build: ./docker_maps/terrain
    image: navcat-terrain:dev
  maps-graphhopper:
    build: ./docker_maps/graphhopper
    image: navcat-graphhopper:dev
  maps-graphhopper-import:
    build: ./docker_maps/graphhopper
    image: navcat-graphhopper:dev
  maps-updater:
    build: ./docker_maps/updater
    image: navcat-updater:dev
  maps-download:
    build: ./docker_maps/download
    image: navcat-download:dev
  maps-data:
    build: ./docker_maps/download
    image: navcat-download:dev
  maps-transit-download:
    build: ./docker_maps/download
    image: navcat-download:dev
  maps-mcp:
    build: ./maps_mcp
    image: navcat-mcp:dev
