# Builds the app's images from this checkout instead of pulling the published ones. `./maps dev`
# uses it for one command; to use it always, put this in .env (./maps follows it too):
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#
# Then `docker compose up -d --build maps-web` (or any service) rebuilds after a change.
# Services sharing an image each name its build too, so nothing tries to pull a :dev image.

services:
  maps-web:
    build: ./maps_web
    image: navcat-web:dev
  maps-backend:
    build: ./maps_backend
    image: navcat-backend:dev
  maps-db:
    build: ./docker_maps/db
    image: navcat-db:dev
  maps-poi-import:
    build: ./docker_maps/db
    image: navcat-db:dev
  maps-terrain-build:
    build: ./docker_maps/terrain
    image: navcat-terrain:dev
  maps-graphhopper:
    build: ./docker_maps/graphhopper
    image: navcat-graphhopper:dev
  maps-graphhopper-import:
    build: ./docker_maps/graphhopper
    image: navcat-graphhopper:dev
  maps-updater:
    build: ./docker_maps/updater
    image: navcat-updater:dev
  maps-download:
    build: ./docker_maps/download
    image: navcat-download:dev
  maps-data:
    build: ./docker_maps/download
    image: navcat-download:dev
  maps-transit-download:
    build: ./docker_maps/download
    image: navcat-download:dev
